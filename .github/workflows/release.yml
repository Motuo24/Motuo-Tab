name: Release

# 打 tag v* 时：构建 + 测试，并发布 Release 附件
#   触发：git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          slug="v${version//./}"
          : > dist/release-notes.md
          if [ -f "docs/images/release-${slug}-banner.jpg" ]; then
            echo "![Motuo-Tab ${GITHUB_REF_NAME}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/images/release-${slug}-banner.jpg)" >> dist/release-notes.md
            echo "" >> dist/release-notes.md
          fi
          if [ -f "docs/images/release-${slug}-bento-zh.jpg" ]; then
            echo "![Motuo-Tab ${GITHUB_REF_NAME} 核心特性一览](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/images/release-${slug}-bento-zh.jpg)" >> dist/release-notes.md
            echo "" >> dist/release-notes.md
          fi
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { printing=1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md >> dist/release-notes.md
      - name: Package extension zip
        run: |
          # 打包成带 extension/ 外层目录的压缩包：
          # 解压后即为 README「选择解压后的 extension 文件夹」对应的文件夹
          cd dist
          zip -r motuo-tab-extension.zip extension
          cd ..
      - uses: softprops/action-gh-release@v2
        with:
          name: Motuo-Tab ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/newtab.html
            dist/motuo-tab-extension.zip
