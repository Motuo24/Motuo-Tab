name: Release

# 打 tag v* 时：构建 + 测试，并发布 Release 附件
#   触发：git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package extension zip
        run: |
          # 打包成带 extension/ 外层目录的压缩包：
          # 解压后即为 README「选择解压后的 extension 文件夹」对应的文件夹
          cd dist
          zip -r motuo-tab-extension.zip extension
          cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/newtab.html
            dist/motuo-tab-extension.zip
